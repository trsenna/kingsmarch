name: "Release dev container images"

on:
  push:
    workflow_dispatch:

jobs:
  # build the foundation
  build-foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Foundation
        uses: devcontainers/action@v1
        with:
          workspace-folder: ./src/foundation
          image-name: ghcr.io/${{ github.repository_owner }}/kingsmarch/foundation
          push-images: "true"
