name: "Release dev container images"

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      # 1. Build the foundation
      - name: Build & Push Foundation
        run: |
          devcontainer build \
            --workspace-folder ./src/foundation \
            --image-name ghcr.io/${{ github.repository_owner }}/kingsmarch/foundation:latest \
            --push

      # 2. Build the baseline
      - name: Build & Push Baseline
        run: |
          devcontainer build \
            --workspace-folder ./src/baseline \
            --image-name ghcr.io/${{ github.repository_owner }}/kingsmarch/baseline:latest \
            --push

      # 3. Build the atelier
      - name: Build & Push Atelier
        run: |
          devcontainer build \
            --workspace-folder ./src/atelier \
            --image-name ghcr.io/${{ github.repository_owner }}/kingsmarch/atelier:latest \
            --push

      # 4. Build the universal
      - name: Build & Push Universal
        run: |
          devcontainer build \
            --workspace-folder ./src/universal \
            --image-name ghcr.io/${{ github.repository_owner }}/kingsmarch/universal:latest \
            --push

      # 5. Cleanup untagged versions
      - name: Cleanup Untagged Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'kingsmarch'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
