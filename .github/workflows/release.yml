name: "Release dev container images"

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: foundation
            dir: ./src/foundation
          - name: baseline
            dir: ./src/baseline
          - name: atelier
            dir: ./src/atelier
          - name: universal
            dir: ./src/universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      - name: Build and Push DevContainer Image
        run: |
          devcontainer build \
            --workspace-folder ${{ matrix.image.dir }} \
            --image-name ghcr.io/${{ github.repository_owner }}/kingsmarch/${{ matrix.image.name }}:latest \
            --push
